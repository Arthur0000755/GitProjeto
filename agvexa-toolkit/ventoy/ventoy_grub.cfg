# AG Vexa Toolkit - menu estendido do Ventoy (tecla F6)
# Recurso oficial: plugin "Menu Extension" (arquivo /ventoy/ventoy_grub.cfg,
# carregado por ventoy_ext_menu em INSTALL/grub/grub.cfg do Ventoy 1.1.18).
#
# Regras deste arquivo (verificadas por scripts/validate-config.sh):
#   * somente comandos informativos (echo, read, clear, set, if, smbios)
#     e de energia (reboot, halt);
#   * nada de carregar kernels, cadeias de boot ou alterar discos;
#   * a versão abaixo deve ser igual ao arquivo VERSION.
#
# Observação: "cat" não existe no GRUB BIOS do Ventoy; por isso o texto
# está em linhas "echo".

menuentry 'Informações do AG Vexa Toolkit' --class=agv-info {
    clear
    echo ''
    echo '  AG VEXA TOOLKIT  -  Diagnóstico, Manutenção e Recuperação'
    echo '  -------------------------------------------------------------'
    echo '  Versão do toolkit : 0.1.0-rc1 (candidata para homologação)'
    echo "  Base de boot      : Ventoy $VENTOY_VERSION"
    echo "  Plataforma atual  : $grub_cpu-$grub_platform  (pc = BIOS legado, efi = UEFI)"
    echo ''
    echo '  Mantido por: AG Vexa - Assistência Técnica'
    echo '  Documentação completa no próprio HD: pasta AGVexa/docs'
    echo '  Scripts pós-formatação do Windows: pasta AGVexa/windows-optimizer'
    echo ''
    echo '  As ferramentas incluídas pertencem aos seus autores e seguem'
    echo '  suas próprias licenças (ver AGVexa/docs/licencas.md).'
    echo ''
    echo '  Pressione ENTER para voltar.'
    read vtAgvKey
}

menuentry 'Guia rápido das categorias' --class=agv-info {
    clear
    echo ''
    echo '  CATEGORIAS DO MENU PRINCIPAL'
    echo '  -------------------------------------------------------------'
    echo '  01 Instalação de Sistemas  - Windows / Linux (APAGA o disco escolhido)'
    echo '  02 Diagnóstico de Hardware - teste de memória RAM (não destrutivo)'
    echo '  03 Manutenção de Discos    - partições e SMART (alterações apagam dados)'
    echo '  04 Backup e Recuperação    - imagem de disco, clonagem, restauração'
    echo '  05 Ambientes Linux Live    - resgate, SMART, TestDisk, PhotoRec, rede'
    echo '  06 Ferramentas Avançadas   - modo texto, apenas para quem tem prática'
    echo ''
    echo '  Categorias sem ferramentas instaladas NÃO aparecem no menu.'
    echo '  Itens marcados [NÃO VERIFICADA] não tiveram o SHA-256 conferido.'
    echo ''
    echo '  Atalhos do Ventoy: F1 ajuda | F4 iniciar disco local'
    echo '                     F5 ferramentas (tema, resolução, modo texto)'
    echo ''
    echo '  Pressione ENTER para voltar.'
    read vtAgvKey
}

menuentry 'Regras de segurança no atendimento' --class=agv-seguranca {
    clear
    echo ''
    echo '  ANTES DE QUALQUER AÇÃO QUE GRAVE EM DISCO'
    echo '  -------------------------------------------------------------'
    echo '  1. Tenha a autorização do proprietário do equipamento (por escrito).'
    echo '  2. Faça e confira o backup antes de reparar, formatar ou instalar.'
    echo '  3. Identifique ORIGEM e DESTINO por modelo, série e capacidade.'
    echo '  4. Diagnóstico primeiro, somente leitura. Reparo depois.'
    echo '  5. Disco com ruído, lentidão extrema ou SMART ruim: não grave nele.'
    echo '     Priorize a cópia dos dados (ddrescue) para outro disco.'
    echo '  6. Não tente contornar senhas ou criptografia (BitLocker etc.).'
    echo '  7. Não copie dados pessoais sem autorização. Nada vai para a internet.'
    echo '  8. Registre tudo no relatório de atendimento.'
    echo ''
    echo '  Na dúvida, PARE e consulte o Manual do Técnico.'
    echo ''
    echo '  Pressione ENTER para voltar.'
    read vtAgvKey
}

menuentry 'Identificação rápida deste computador' --class=agv-hardware {
    clear
    set agv_vendor='-'
    set agv_product='-'
    set agv_bios='-'
    set agv_cpu='-'
    smbios -t 1 -s 0x04 --set=agv_vendor
    smbios -t 1 -s 0x05 --set=agv_product
    smbios -t 0 -s 0x05 --set=agv_bios
    smbios -t 4 -s 0x10 --set=agv_cpu
    echo ''
    echo '  IDENTIFICAÇÃO (somente leitura, dados SMBIOS do firmware)'
    echo '  -------------------------------------------------------------'
    echo "  Fabricante : $agv_vendor"
    echo "  Modelo     : $agv_product"
    echo "  BIOS/UEFI  : $agv_bios"
    echo "  Processador: $agv_cpu"
    echo "  Plataforma : $grub_cpu-$grub_platform"
    echo ''
    echo '  Mais detalhes: F5 > Informações de hardware (recurso do Ventoy).'
    echo ''
    echo '  Pressione ENTER para voltar.'
    read vtAgvKey
}

menuentry 'Reiniciar o computador' --class=agv-reiniciar {
    echo ''
    echo '  Reiniciando...'
    sleep 1
    reboot
}

menuentry 'Desligar o computador' --class=agv-energia {
    echo ''
    echo '  Desligando...'
    sleep 1
    halt
}

menuentry '<-- Voltar ao menu principal [Esc]' --class=vtoyret VTOY_RET {
    echo 'Voltando...'
}
